# настройки по умолчанию
settings:
  # язык
  locale: "ru_RU"

  # пути по умолчанию
  defaultDir:
    windows: "C:\\"
    linux: "/"
  
  # команды линукс
  linuxCommands:
    console: "foot -D"
    open: "xdg-open"
    moveToTrash: "gio trash"

  # логгер
  loggerSettings:
    level: "ERROR"
    # по умолчанию будем сбрасывать в папку файлового менеджера. 
    # Если пользователь захочет, сможет задать другой путь
    path: "" 
  